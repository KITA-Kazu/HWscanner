<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI宿題リマスター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    @media print {
      body * { visibility: hidden; }
      #printable-canvas, #printable-canvas * { visibility: visible; }
      #printable-canvas { position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight text-slate-900">AI宿題リマスター</h1>
        <p class="text-xs text-slate-500">手書きと赤ペンを消去して白紙復元</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button id="btn-settings" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition flex items-center space-x-1">
        <i class="fa-solid fa-key"></i><span id="key-status">API設定</span>
      </button>
      <button id="btn-print" class="hidden sm:inline-flex items-center space-x-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition">
        <i class="fa-solid fa-print"></i><span>印刷</span>
      </button>
      <button id="btn-download" class="hidden inline-flex items-center space-x-1 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg shadow transition">
        <i class="fa-solid fa-download"></i><span>保存</span>
      </button>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center p-3 relative">
    
    <div id="drop-zone" class="w-full max-w-md border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center bg-white shadow-sm">
      <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
        <i class="fa-solid fa-file-invoice"></i>
      </div>
      <h2 class="text-base font-bold text-slate-800 mb-1">宿題プリントを読み込む</h2>
      <p class="text-xs text-slate-500 mb-4">下線や印刷文字を残して手書き・赤ペンだけを消去します</p>
      
      <div class="flex flex-col sm:flex-row gap-2 justify-center">
        <label class="cursor-pointer inline-flex items-center justify-center space-x-2 px-4 py-2.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl shadow hover:bg-indigo-700 transition">
          <i class="fa-solid fa-camera"></i>
          <span>カメラで撮影</span>
          <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
        </label>
        <label class="cursor-pointer inline-flex items-center justify-center space-x-2 px-4 py-2.5 bg-slate-100 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-200 transition">
          <i class="fa-solid fa-image"></i>
          <span>写真ライブラリ</span>
          <input type="file" id="file-input" accept="image/*" class="hidden">
        </label>
      </div>
    </div>

    <div id="result-wrapper" class="hidden w-full max-w-2xl flex flex-col items-center">
      <div id="printable-canvas" class="relative max-h-[70vh] flex items-center justify-center shadow-lg rounded-xl overflow-hidden bg-white border border-slate-200">
        <canvas id="main-canvas" class="max-h-[70vh] max-w-full object-contain block"></canvas>
      </div>
      <div class="mt-4 flex gap-3">
        <button id="btn-reselect" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-xl transition">
          別の写真を消去
        </button>
      </div>
    </div>

    <div id="loader" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center z-50 text-white p-4">
      <div class="w-12 h-12 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p id="loader-text" class="font-bold text-sm mb-1">AIが手書き箇所を解析中...</p>
      <p id="loader-subtext" class="text-xs text-slate-300">下線と印刷文字を保護して白紙化しています</p>
    </div>

  </main>

  <div id="key-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <h3 class="font-bold text-base text-slate-900 mb-2">Gemini APIキーの設定</h3>
      <p class="text-xs text-slate-500 mb-3 leading-relaxed">
        Google AI Studioで無料発行したAPIキーを入力してください。
      </p>
      <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs mb-3 font-mono focus:outline-none focus:border-indigo-600">
      <div class="flex justify-end space-x-2">
        <button id="btn-close-modal" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">キャンセル</button>
        <button id="btn-save-key" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow">保存</button>
      </div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';
    const dropZone = document.getElementById('drop-zone');
    const resultWrapper = document.getElementById('result-wrapper');
    const mainCanvas = document.getElementById('main-canvas');
    const mainCtx = mainCanvas.getContext('2d');
    const loader = document.getElementById('loader');
    const loaderText = document.getElementById('loader-text');
    const loaderSubtext = document.getElementById('loader-subtext');
    const btnDownload = document.getElementById('btn-download');
    const btnPrint = document.getElementById('btn-print');
    const keyStatus = document.getElementById('key-status');
    const keyModal = document.getElementById('key-modal');
    const inputApiKey = document.getElementById('input-api-key');

    function updateKeyBadge() {
      keyStatus.innerHTML = apiKey ? '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>設定済</span>' : '<span class="text-amber-600 font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>未設定</span>';
    }
    updateKeyBadge();

    document.getElementById('btn-settings').addEventListener('click', () => { inputApiKey.value = apiKey; keyModal.classList.remove('hidden'); });
    document.getElementById('btn-close-modal').addEventListener('click', () => keyModal.classList.add('hidden'));
    document.getElementById('btn-save-key').addEventListener('click', () => {
      apiKey = inputApiKey.value.trim();
      localStorage.setItem('GEMINI_API_KEY', apiKey);
      updateKeyBadge();
      keyModal.classList.add('hidden');
    });

    ['camera-input', 'file-input'].forEach(id => {
      document.getElementById(id).addEventListener('change', (e) => {
        if (!apiKey) {
          keyModal.classList.remove('hidden');
          alert('右上のボタンからGemini APIキーを設定してください。');
          return;
        }
        if (e.target.files && e.target.files[0]) handleFile(e.target.files[0]);
      });
    });

    document.getElementById('btn-reselect').addEventListener('click', () => {
      dropZone.classList.remove('hidden');
      resultWrapper.classList.add('hidden');
      btnDownload.classList.add('hidden');
    });

    async function handleFile(file) {
      loaderText.innerText = "写真を読み込み中...";
      loaderSubtext.innerText = "画像を最適な解像度に調整しています";
      loader.classList.remove('hidden');

      const img = new Image();
      const reader = new FileReader();

      reader.onload = async (e) => {
        img.onload = async () => {
          let w = img.width, h = img.height;
          const maxDim = 1200;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          mainCanvas.width = w;
          mainCanvas.height = h;
          mainCtx.drawImage(img, 0, 0, w, h);

          await runAnalysis(mainCanvas.toDataURL('image/jpeg', 0.8), w, h);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function runAnalysis(base64Data, width, height) {
      loaderText.innerText = "AIが手書きと赤ペン箇所を検出中...";
      loaderSubtext.innerText = "下線と印刷文字を保護して白紙化しています";

      const prompt = `この画像内の【手書き文字（鉛筆・ペン）】および【赤ペン・朱色スタンプ・丸付け】のバウンディングボックス一覧をJSON形式で返してください。
【除外（消してはいけないもの）】
- 印刷された教科書名、設問文、Task、Goalなどの活字
- 罫線、下線（アンダーライン）
【出力フォーマット（必ずこのキー構造にしてください）】
{"boxes": [{"ymin": 0, "xmin": 0, "ymax": 1000, "xmax": 1000}]}`;

      const candidateModels = [
        "gemini-2.0-flash",
        "gemini-1.5-flash"
      ];

      let lastError = null;
      let boxes = [];

      for (let model of candidateModels) {
        try {
          loaderSubtext.innerText = `AIエンジン（${model}）で解析しています...`;
          
          const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [
                  { text: prompt },
                  {
                    inline_data: {
                      mime_type: "image/jpeg",
                      data: base64Data.split(',')[1]
                    }
                  }
                ]
              }],
              generationConfig: {
                response_mime_type: "application/json"
              }
            })
          });

          if (!res.ok) {
            const err = await res.json();
            throw new Error(err.error?.message || `HTTP ${res.status}`);
          }

          const data = await res.json();
          let rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
          
          // マークダウンや余計な空白を徹底除去してパース
          rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
          const firstBrace = rawText.indexOf('{');
          const lastBrace = rawText.lastIndexOf('}');
          if (firstBrace !== -1 && lastBrace !== -1) {
            rawText = rawText.substring(firstBrace, lastBrace + 1);
          }

          const parsed = JSON.parse(rawText);
          boxes = parsed.boxes || [];

          lastError = null;
          break;

        } catch (err) {
          console.warn(`${model} 試行エラー:`, err);
          lastError = err;
        }
      }

      if (lastError && boxes.length === 0) {
        alert('解析エラーが発生しました。もう一度お試しください。\n詳細: ' + lastError.message);
        loader.classList.add('hidden');
        return;
      }

      loaderText.innerText = "下線を残して手書きを消去中...";
      applyErase(boxes, width, height);

      dropZone.classList.add('hidden');
      resultWrapper.classList.remove('hidden');
      btnDownload.classList.remove('hidden');
      loader.classList.add('hidden');
    }

    function applyErase(boxes, w, h) {
      const imgData = mainCtx.getImageData(0, 0, w, h);
      const d = imgData.data;

      // 1. 赤ペン・赤丸を画像全体から消去
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        if (r > 80 && r > g * 1.35 && r > b * 1.35) {
          d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
        }
      }

      // 2. AIが検出した手書き領域内だけを消去（下線 lum < 50 は保持）
      boxes.forEach(b => {
        const y0 = Math.floor((b.ymin / 1000) * h);
        const y1 = Math.ceil((b.ymax / 1000) * h);
        const x0 = Math.floor((b.xmin / 1000) * w);
        const x1 = Math.ceil((b.xmax / 1000) * w);

        for (let y = y0; y <= y1; y++) {
          if (y < 0 || y >= h) continue;
          for (let x = x0; x <= x1; x++) {
            if (x < 0 || x >= w) continue;
            const idx = (y * w + x) * 4;
            const lum = 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
            // 罫線・下線の漆黒は残し、手書きのみ白に置き換え
            if (lum >= 50) {
              d[idx] = 255; d[idx + 1] = 255; d[idx + 2] = 255;
            }
          }
        }
      });

      mainCtx.putImageData(imgData, 0, 0);
    }

    btnDownload.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'remastered.png';
      link.href = mainCanvas.toDataURL('image/png');
      link.click();
    });

    btnPrint.addEventListener('click', () => window.print());
  </script>
</body>
</html>
