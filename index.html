<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宿題リマスター</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    body { touch-action: none; -webkit-tap-highlight-color: transparent; }
    #main-canvas { touch-action: none; user-select: none; }
    .slider-track { -webkit-appearance: none; appearance: none; height: 5px; border-radius: 3px; background: #cbd5e1; outline: none; }
    .slider-track::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #2563eb; cursor: pointer; }
    @media print {
      body * { visibility: hidden; }
      #main-canvas, #main-canvas * { visibility: visible; }
      #main-canvas { position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-3 py-2 flex items-center justify-between shrink-0 z-30 shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white font-bold shadow text-sm">
        <i class="fa-solid fa-eraser"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm leading-tight text-slate-900">宿題リマスター</h1>
        <p class="text-[10px] text-slate-500">赤ペン自動消去 ＆ 囲み手書き消去</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-1.5">
      <button id="btn-undo" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg disabled:opacity-40 disabled:pointer-events-none transition flex items-center space-x-1" disabled>
        <i class="fa-solid fa-rotate-left"></i><span>元に戻す</span>
      </button>

      <div id="export-group" class="hidden flex items-center space-x-1">
        <button id="btn-pdf" class="inline-flex items-center space-x-1 px-2.5 py-1.5 bg-red-600 hover:bg-red-700 text-white text-xs font-semibold rounded-lg shadow transition">
          <i class="fa-solid fa-file-pdf"></i><span>PDF</span>
        </button>
        <button id="btn-jpg" class="inline-flex items-center space-x-1 px-2 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition">
          <i class="fa-solid fa-image"></i><span>JPG</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 操作ガイドバナー -->
  <div id="guide-banner" class="hidden bg-blue-50 border-b border-blue-200 px-3 py-1.5 text-center text-xs text-blue-700 flex items-center justify-center space-x-1.5 shrink-0">
    <i class="fa-solid fa-vector-square text-blue-600"></i>
    <span>消したい手書きの文字を<strong>指やペンで四角くドラッグして囲む</strong>と消去されます</span>
  </div>

  <!-- キャンバスエリア -->
  <main class="flex-1 relative flex items-center justify-center p-2 bg-slate-200 overflow-hidden">
    
    <!-- ファイル未選択時 -->
    <div id="drop-zone" class="w-full max-w-sm border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center bg-white shadow-sm">
      <div class="w-14 h-14 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
        <i class="fa-solid fa-file-invoice"></i>
      </div>
      <h2 class="text-sm font-bold text-slate-800 mb-1">宿題プリントを選択</h2>
      <p class="text-[11px] text-slate-500 mb-4">赤ペンは自動消去。手書きは囲んで一発消去できます</p>
      
      <div class="flex flex-col gap-2">
        <label class="cursor-pointer inline-flex items-center justify-center space-x-2 px-4 py-2 bg-blue-600 text-white text-xs font-semibold rounded-xl shadow hover:bg-blue-700 transition">
          <i class="fa-solid fa-camera"></i>
          <span>カメラで撮影</span>
          <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
        </label>
        <label class="cursor-pointer inline-flex items-center justify-center space-x-2 px-4 py-2 bg-slate-100 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-200 transition">
          <i class="fa-solid fa-image"></i>
          <span>写真ライブラリ</span>
          <input type="file" id="file-input" accept="image/*" class="hidden">
        </label>
      </div>
    </div>

    <!-- メインキャンバス -->
    <div id="canvas-container" class="hidden relative max-h-full max-w-full flex items-center justify-center shadow-md rounded bg-white">
      <canvas id="main-canvas" class="max-w-full max-h-[75vh] object-contain block cursor-crosshair"></canvas>
      
      <button id="btn-compare" class="absolute top-2 right-2 px-3 py-1.5 bg-slate-900/80 hover:bg-slate-900 text-white text-xs rounded-full shadow transition flex items-center space-x-1 select-none z-10">
        <i class="fa-solid fa-eye"></i><span>長押しで元画像</span>
      </button>
    </div>

  </main>

  <!-- 下部ツールバー -->
  <footer id="footer-toolbar" class="hidden bg-white border-t border-slate-200 px-4 py-2 shrink-0 z-20 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs">
    <div class="flex items-center space-x-3 w-full sm:w-auto">
      <span class="text-[11px] text-slate-500 whitespace-nowrap">消去の強さ (筆圧):</span>
      <input type="range" id="slider-threshold" min="40" max="90" value="65" class="slider-track w-36">
      <span id="threshold-val" class="text-blue-600 font-bold text-xs w-6">65</span>
    </div>
    <button id="btn-reselect" class="text-slate-400 hover:text-slate-600 underline text-[11px]">
      別の写真を読み込む
    </button>
  </footer>

  <script>
    let originalImg = null;
    let baseCanvas = document.createElement('canvas'); // 赤ペン消去直後の状態
    let baseCtx = baseCanvas.getContext('2d');

    const mainCanvas = document.getElementById('main-canvas');
    const mainCtx = mainCanvas.getContext('2d');

    const dropZone = document.getElementById('drop-zone');
    const canvasContainer = document.getElementById('canvas-container');
    const guideBanner = document.getElementById('guide-banner');
    const footerToolbar = document.getElementById('footer-toolbar');
    const exportGroup = document.getElementById('export-group');
    const btnUndo = document.getElementById('btn-undo');
    const sliderThreshold = document.getElementById('slider-threshold');
    const thresholdVal = document.getElementById('threshold-val');

    let historyStack = [];
    const MAX_HISTORY = 10;

    let isSelecting = false;
    let startX = 0, startY = 0;
    let currentX = 0, currentY = 0;
    let tempImageData = null;

    // スライダー更新
    sliderThreshold.addEventListener('input', (e) => {
      thresholdVal.innerText = e.target.value;
    });

    // 画像読み込み
    ['camera-input', 'file-input'].forEach(id => {
      document.getElementById(id).addEventListener('change', (e) => {
        if (e.target.files && e.target.files[0]) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            const img = new Image();
            img.onload = () => {
              originalImg = img;
              setupWorkspace(img);
            };
            img.src = evt.target.result;
          };
          reader.readAsDataURL(e.target.files[0]);
        }
      });
    });

    document.getElementById('btn-reselect').addEventListener('click', () => {
      dropZone.classList.remove('hidden');
      canvasContainer.classList.add('hidden');
      guideBanner.classList.add('hidden');
      footerToolbar.classList.add('hidden');
      exportGroup.classList.add('hidden');
    });

    function setupWorkspace(img) {
      let w = img.width, h = img.height;
      const maxDim = 1600;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
        else { w = Math.round((w * maxDim) / h); h = maxDim; }
      }

      baseCanvas.width = w;
      baseCanvas.height = h;
      mainCanvas.width = w;
      mainCanvas.height = h;

      // 元画像を描画
      baseCtx.drawImage(img, 0, 0, w, h);

      // 高精度・適応型の赤ペン消去
      removeRedPenSmart(baseCtx, w, h);

      // 表示キャンバスにコピー
      mainCtx.drawImage(baseCanvas, 0, 0);

      historyStack = [];
      updateUndoButton();

      dropZone.classList.add('hidden');
      canvasContainer.classList.remove('hidden');
      guideBanner.classList.remove('hidden');
      footerToolbar.classList.remove('hidden');
      exportGroup.classList.remove('hidden');
    }

    // 周囲の紙色に馴染ませながら赤ペン・朱色を自動消去
    function removeRedPenSmart(ctx, w, h) {
      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;

      // 判定用マスク
      const isRedMask = new Uint8Array(w * h);

      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const diff = max - min;

        // 赤・朱色の色相範囲判定（RGBベース）
        // 赤ペン、朱肉スタンプ、オレンジがかった赤文字を網羅
        const isRed = (r > 70) && (diff > 25) && (r > g * 1.20) && (r > b * 1.20);
        if (isRed) {
          isRedMask[i / 4] = 1;
        }
      }

      // 赤色ピクセルを周辺の紙の明るさで置き換え（白浮き防止）
      for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
          const idx = y * w + x;
          if (isRedMask[idx]) {
            // 左右5px以内にある「赤ではない紙面ピクセル」の色を探す
            let sampleR = 245, sampleG = 245, sampleB = 245;
            for (let dx = -6; dx <= 6; dx++) {
              const nx = x + dx;
              if (nx >= 0 && nx < w) {
                const nIdx = y * w + nx;
                if (!isRedMask[nIdx]) {
                  const p = nIdx * 4;
                  const lum = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
                  if (lum > 80) { // 印刷黒文字を避けて紙色を取得
                    sampleR = d[p]; sampleG = d[p + 1]; sampleB = d[p + 2];
                    break;
                  }
                }
              }
            }
            const p = idx * 4;
            d[p] = sampleR;
            d[p + 1] = sampleG;
            d[p + 2] = sampleB;
          }
        }
      }

      ctx.putImageData(imgData, 0, 0);
    }

    // 座標取得関数（比率ズレを完全に補正）
    function getCanvasCoords(e) {
      const rect = mainCanvas.getBoundingClientRect();
      const scaleX = mainCanvas.width / rect.width;
      const scaleY = mainCanvas.height / rect.height;

      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      return {
        x: Math.round((clientX - rect.left) * scaleX),
        y: Math.round((clientY - rect.top) * scaleY)
      };
    }

    // ドラッグ選択開始
    function handleDown(e) {
      isSelecting = true;
      const pos = getCanvasCoords(e);
      startX = pos.x;
      startY = pos.y;
      currentX = pos.x;
      currentY = pos.y;
      tempImageData = mainCtx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
    }

    // ドラッグ中（青い選択枠を描画）
    function handleMove(e) {
      if (!isSelecting || !tempImageData) return;
      const pos = getCanvasCoords(e);
      currentX = pos.x;
      currentY = pos.y;

      // 一旦前フレームの状態に戻して枠を描く
      mainCtx.putImageData(tempImageData, 0, 0);

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const bw = Math.abs(currentX - startX);
      const bh = Math.abs(currentY - startY);

      mainCtx.save();
      mainCtx.fillStyle = 'rgba(59, 130, 246, 0.15)';
      mainCtx.fillRect(x, y, bw, bh);
      mainCtx.strokeStyle = 'rgba(37, 99, 235, 0.85)';
      mainCtx.lineWidth = 3;
      mainCtx.setLineDash([8, 6]);
      mainCtx.strokeRect(x, y, bw, bh);
      mainCtx.restore();
    }

    // ドラッグ終了（囲み箇所の消去実行）
    function handleUp() {
      if (!isSelecting) return;
      isSelecting = false;

      if (tempImageData) {
        mainCtx.putImageData(tempImageData, 0, 0);
      }

      const x = Math.min(startX, currentX);
      const y = Math.min(startY, currentY);
      const bw = Math.abs(currentX - startX);
      const bh = Math.abs(currentY - startY);

      // 小さな誤タップでなければ消去実行
      if (bw >= 6 && bh >= 6) {
        saveState();
        executeAreaErase(x, y, bw, bh);
      }
      tempImageData = null;
    }

    // 囲み消去ロジック（下線保護 ＆ 周囲色馴染ませ）
    function executeAreaErase(bx, by, bw, bh) {
      const fullW = mainCanvas.width;
      const fullH = mainCanvas.height;

      const imgData = mainCtx.getImageData(0, 0, fullW, fullH);
      const d = imgData.data;

      const x0 = Math.max(0, bx);
      const x1 = Math.min(fullW - 1, bx + bw);
      const y0 = Math.max(0, by);
      const y1 = Math.min(fullH - 1, by + bh);

      // 枠の外周（上・下のフチ）から周囲の紙の色をサンプリング
      let bgR = 0, bgG = 0, bgB = 0, count = 0;
      for (let x = x0; x <= x1; x += 2) {
        [Math.max(0, y0 - 3), Math.min(fullH - 1, y1 + 3)].forEach(sy => {
          const idx = (sy * fullW + x) * 4;
          const lum = 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          if (lum > 80) { // 文字の黒を避けて紙の地色を取得
            bgR += d[idx]; bgG += d[idx + 1]; bgB += d[idx + 2];
            count++;
          }
        });
      }

      const fillR = count > 0 ? Math.round(bgR / count) : 246;
      const fillG = count > 0 ? Math.round(bgG / count) : 246;
      const fillB = count > 0 ? Math.round(bgB / count) : 246;

      // スライダーで設定された下線保護のしきい値
      // これより濃い黒（印刷下線や枠線）は残し、それ以上の鉛筆を周囲の紙色で塗り替え
      const lineProtectLum = parseInt(sliderThreshold.value, 10);

      for (let y = y0; y <= y1; y++) {
        for (let x = x0; x <= x1; x++) {
          const idx = (y * fullW + x) * 4;
          const lum = 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];

          // 下線（漆黒・濃い線）は保護、手書き鉛筆部分のみ周辺色に置換
          if (lum >= lineProtectLum) {
            d[idx] = fillR;
            d[idx + 1] = fillG;
            d[idx + 2] = fillB;
          }
        }
      }

      mainCtx.putImageData(imgData, 0, 0);
    }

    // イベント登録（PC・スマホ両対応）
    mainCanvas.addEventListener('mousedown', handleDown);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleUp);

    mainCanvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleDown(e); }, { passive: false });
    window.addEventListener('touchmove', (e) => { if (isSelecting) { e.preventDefault(); handleMove(e); } }, { passive: false });
    window.addEventListener('touchend', handleUp);

    // 元に戻す機能
    function saveState() {
      if (historyStack.length >= MAX_HISTORY) historyStack.shift();
      historyStack.push(mainCtx.getImageData(0, 0, mainCanvas.width, mainCanvas.height));
      updateUndoButton();
    }

    btnUndo.addEventListener('click', () => {
      if (historyStack.length > 0) {
        const lastState = historyStack.pop();
        mainCtx.putImageData(lastState, 0, 0);
        updateUndoButton();
      }
    });

    function updateUndoButton() {
      btnUndo.disabled = historyStack.length === 0;
    }

    // 長押しで元画像表示
    const btnCompare = document.getElementById('btn-compare');
    const showOriginal = () => { if (originalImg) mainCtx.drawImage(originalImg, 0, 0, mainCanvas.width, mainCanvas.height); };
    const restoreView = () => {
      if (historyStack.length > 0) {
        mainCtx.putImageData(historyStack[historyStack.length - 1], 0, 0);
      } else {
        mainCtx.drawImage(baseCanvas, 0, 0);
      }
    };

    btnCompare.addEventListener('mousedown', showOriginal);
    window.addEventListener('mouseup', restoreView);
    btnCompare.addEventListener('touchstart', (e) => { e.preventDefault(); showOriginal(); });
    window.addEventListener('touchend', restoreView);

    // A4 PDF出力
    document.getElementById('btn-pdf').addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: mainCanvas.width > mainCanvas.height ? 'landscape' : 'portrait',
        unit: 'mm',
        format: 'a4'
      });

      const imgData = mainCanvas.toDataURL('image/jpeg', 0.95);
      const pageWidth = pdf.internal.pageSize.getWidth();
      const pageHeight = pdf.internal.pageSize.getHeight();
      
      const imgRatio = mainCanvas.width / mainCanvas.height;
      const pageRatio = pageWidth / pageHeight;

      let renderW = pageWidth, renderH = pageHeight;
      if (imgRatio > pageRatio) {
        renderH = pageWidth / imgRatio;
      } else {
        renderW = pageHeight * imgRatio;
      }

      const offsetX = (pageWidth - renderW) / 2;
      const offsetY = (pageHeight - renderH) / 2;

      pdf.addImage(imgData, 'JPEG', offsetX, offsetY, renderW, renderH);
      pdf.save('homework_clean.pdf');
    });

    // JPEG保存
    document.getElementById('btn-jpg').addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'homework_clean.jpg';
      link.href = mainCanvas.toDataURL('image/jpeg', 0.92);
      link.click();
    });
  </script>
</body>
</html>
