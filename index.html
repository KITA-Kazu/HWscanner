<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI宿題リマスター - 完全消去＆白紙復元</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    @media print {
      body * { visibility: hidden; }
      #result-img, #result-img * { visibility: visible; }
      #result-img { position: absolute; left: 0; top: 0; width: 100%; margin: 0; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 flex items-center justify-between sticky top-0 z-30 shadow-sm">
    <div class="flex items-center space-x-2">
      <div class="w-9 h-9 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-tight text-slate-900">AI宿題リマスター</h1>
        <p class="text-xs text-slate-500">AIが印刷文字・下線を保護して手書きのみ消去</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button id="btn-settings" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition flex items-center space-x-1">
        <i class="fa-solid fa-key"></i><span id="key-status">APIキー設定</span>
      </button>
      <button id="btn-print" class="hidden sm:inline-flex items-center space-x-1 px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition">
        <i class="fa-solid fa-print"></i><span>印刷</span>
      </button>
      <button id="btn-download" class="hidden inline-flex items-center space-x-1 px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-medium rounded-lg shadow transition">
        <i class="fa-solid fa-download"></i><span>保存</span>
      </button>
    </div>
  </header>

  <!-- メインワークスペース -->
  <main class="flex-1 flex flex-col items-center justify-center p-3 relative">
    
    <!-- 写真選択カード -->
    <div id="drop-zone" class="w-full max-w-md border-2 border-dashed border-slate-300 rounded-2xl p-6 text-center bg-white shadow-sm">
      <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
        <i class="fa-solid fa-file-invoice"></i>
      </div>
      <h2 class="text-base font-bold text-slate-800 mb-1">宿題プリントを読み込む</h2>
      <p class="text-xs text-slate-500 mb-4">AIが下線や印刷文字を正確に残し、手書きと赤ペンだけを新品状態に消去します</p>
      
      <div class="flex flex-col sm:flex-row gap-2 justify-center">
        <label class="cursor-pointer inline-flex items-center justify-center space-x-2 px-4 py-2.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl shadow hover:bg-indigo-700 transition">
          <i class="fa-solid fa-camera"></i>
          <span>カメラで撮影</span>
          <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
        </label>
        <label class="cursor-pointer inline-flex items-center justify-center space-x-2 px-4 py-2.5 bg-slate-100 text-slate-700 text-xs font-semibold rounded-xl hover:bg-slate-200 transition">
          <i class="fa-solid fa-image"></i>
          <span>写真ライブラリ</span>
          <input type="file" id="file-input" accept="image/*" class="hidden">
        </label>
      </div>
    </div>

    <!-- 結果表示エリア -->
    <div id="result-wrapper" class="hidden w-full max-w-2xl flex flex-col items-center">
      <div class="relative max-h-[70vh] flex items-center justify-center shadow-lg rounded-xl overflow-hidden bg-white border border-slate-200">
        <img id="result-img" class="max-h-[70vh] max-w-full object-contain block" alt="復元されたプリント">
      </div>

      <div class="mt-4 flex gap-3">
        <button id="btn-reselect" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-semibold rounded-xl transition">
          別の写真を消去
        </button>
      </div>
    </div>

    <!-- AI処理中ローダー -->
    <div id="loader" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex flex-col items-center justify-center z-50 text-white p-4">
      <div class="w-12 h-12 border-4 border-indigo-400 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="font-bold text-sm mb-1">AIが手書き文字と赤ペンを消去中...</p>
      <p class="text-xs text-slate-300">印刷文字と罫線を保護して白紙プリントを再構築しています</p>
    </div>

  </main>

  <!-- APIキー設定モーダル -->
  <div id="key-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl">
      <h3 class="font-bold text-base text-slate-900 mb-2">Gemini APIキーの設定</h3>
      <p class="text-xs text-slate-500 mb-3 leading-relaxed">
        Google AI Studioで無料発行できるAPIキーを入力してください。キーはお使いのブラウザ内（ローカル）にのみ安全に保存されます。
      </p>
      <input type="password" id="input-api-key" placeholder="AIzaSy..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs mb-3 font-mono focus:outline-none focus:border-indigo-600">
      
      <div class="text-[11px] text-indigo-600 mb-4">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener noreferrer" class="hover:underline flex items-center space-x-1">
          <i class="fa-solid fa-arrow-up-right-from-square"></i><span>無料APIキーの取得はこちら（Google公式）</span>
        </a>
      </div>

      <div class="flex justify-end space-x-2">
        <button id="btn-close-modal" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded-lg">キャンセル</button>
        <button id="btn-save-key" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg shadow">保存</button>
      </div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('GEMINI_API_KEY') || '';
    const dropZone = document.getElementById('drop-zone');
    const resultWrapper = document.getElementById('result-wrapper');
    const resultImg = document.getElementById('result-img');
    const loader = document.getElementById('loader');
    const btnDownload = document.getElementById('btn-download');
    const btnPrint = document.getElementById('btn-print');
    const keyStatus = document.getElementById('key-status');
    const keyModal = document.getElementById('key-modal');
    const inputApiKey = document.getElementById('input-api-key');

    function updateKeyBadge() {
      if (apiKey) {
        keyStatus.innerHTML = '<span class="text-emerald-600 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>API設定済</span>';
      } else {
        keyStatus.innerHTML = '<span class="text-amber-600 font-bold"><i class="fa-solid fa-triangle-exclamation mr-1"></i>キー未設定</span>';
      }
    }
    updateKeyBadge();

    // モード・モーダル制御
    document.getElementById('btn-settings').addEventListener('click', () => {
      inputApiKey.value = apiKey;
      keyModal.classList.remove('hidden');
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      keyModal.classList.add('hidden');
    });
    document.getElementById('btn-save-key').addEventListener('click', () => {
      apiKey = inputApiKey.value.trim();
      localStorage.setItem('GEMINI_API_KEY', apiKey);
      updateKeyBadge();
      keyModal.classList.add('hidden');
    });

    // 画像読み込み
    ['camera-input', 'file-input'].forEach(id => {
      document.getElementById(id).addEventListener('change', (e) => {
        if (!apiKey) {
          keyModal.classList.remove('hidden');
          alert('まずGeminiの無料APIキーを入力してください。');
          return;
        }
        if (e.target.files && e.target.files[0]) {
          processWithAI(e.target.files[0]);
        }
      });
    });

    document.getElementById('btn-reselect').addEventListener('click', () => {
      dropZone.classList.remove('hidden');
      resultWrapper.classList.add('hidden');
      btnDownload.classList.add('hidden');
    });

    // AIリマスター処理
    async function processWithAI(file) {
      loader.classList.remove('hidden');

      try {
        const base64Data = await fileToBase64(file);

        // Gemini 2.5 Flash / 1.5 Flash を使用した高精度プロンプト
        const prompt = `あなたは教育用プリントの白紙復元エキスパートです。
提供された宿題プリントの画像から、以下の処理を完璧に実行した【綺麗な白紙プリントの画像】を再構築してください。

【厳格な指示】
1. 印刷文字（教科書名、Lesson表記、設問文、Task、Goal、英単語、括弧など）は【一文字も欠けさせず、元のフォント・位置のまま完全保護】してください。
2. 下線（アンダーライン）や枠線、罫線などの印刷ガイドラインは【一切消さず、水平・直線として鮮明に残して】ください。
3. 赤ペン（丸付けの丸、採点、手書き文字）および鉛筆で書かれた手書き解答（Task 1, Task 2, Goal欄内の手書き英単語など）は【跡形もなく完全に消去し、周囲の用紙と同じ清潔な白色】にしてください。
4. スマホ撮影特有の手の影や照明のムラ、紙の黄ばみを均一に補正し、家庭用プリンターで印刷できるクリアな白紙（コントラスト強調）に仕上げてください。

再構築した画像のみを出力してください。`;

        const requestBody = {
          contents: [{
            parts: [
              { text: prompt },
              {
                inline_data: {
                  mime_type: file.type || "image/jpeg",
                  data: base64Data.split(',')[1]
                }
              }
            ]
          }],
          generationConfig: {
            response_mime_type: "image/png"
          }
        };

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(requestBody)
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || 'API呼び出しに失敗しました。');
        }

        const data = await res.json();
        const candidate = data.candidates?.[0];
        const part = candidate?.content?.parts?.[0];

        if (part?.inline_data?.data) {
          resultImg.src = `data:${part.inline_data.mime_type};base64,${part.inline_data.data}`;
          dropZone.classList.add('hidden');
          resultWrapper.classList.remove('hidden');
          btnDownload.classList.remove('hidden');
        } else {
          throw new Error('画像の生成に失敗しました。APIキーまたは画像形式を確認してください。');
        }

      } catch (err) {
        alert('エラーが発生しました: ' + err.message);
      } finally {
        loader.classList.add('hidden');
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 保存＆印刷
    btnDownload.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'remastered_clean_print.png';
      link.href = resultImg.src;
      link.click();
    });

    btnPrint.addEventListener('click', () => {
      window.print();
    });
  </script>
</body>
</html>
