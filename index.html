<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>宿題スキャナー・リマスター | 手書き一括消去</title>
  
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      touch-action: pan-x pan-y;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 flex flex-col h-screen overflow-hidden font-sans">

  <!-- ヘッダー -->
  <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shadow-sm z-30 flex-shrink-0">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow">
        <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
      </div>
      <div>
        <h1 class="text-sm md:text-base font-bold text-slate-900 leading-tight">宿題リマスター</h1>
        <p class="text-[10px] md:text-xs text-slate-500">手書き鉛筆・赤ペン・指影の一括消去</p>
      </div>
    </div>
    
    <div class="flex items-center space-x-2">
      <button id="btn-export-pdf" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow-sm flex items-center gap-1.5 transition disabled:opacity-40" disabled>
        <i class="fa-solid fa-file-pdf"></i>
        <span>PDF一括保存</span>
      </button>
    </div>
  </header>

  <!-- メインワークスペース -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">

    <!-- プレビュー＆操作エリア -->
    <div class="flex-1 flex flex-col relative bg-slate-200 overflow-hidden">
      
      <!-- メインキャンバス・ビューワー -->
      <div id="viewer-container" class="flex-1 relative flex items-center justify-center p-3 overflow-hidden select-none">
        
        <!-- 空状態案内 -->
        <div id="empty-state" class="text-center p-6 bg-white/95 backdrop-blur rounded-2xl shadow-lg border border-slate-200 max-w-sm">
          <div class="w-16 h-16 mx-auto mb-3 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-2xl">
            <i class="fa-regular fa-images"></i>
          </div>
          <h2 class="text-base font-bold text-slate-800 mb-1">宿題プリントを選択</h2>
          <p class="text-xs text-slate-500 mb-4">まとめて複数枚の写真を選択できます。<br>手書き文字・丸付け・影を自動消去します。</p>
          <div class="flex flex-col gap-2">
            <label class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs rounded-xl shadow cursor-pointer transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-plus"></i> プリントを追加する
              <input type="file" id="input-files" accept="image/*" multiple class="hidden">
            </label>
            <label class="w-full py-2.5 px-4 bg-white border border-slate-300 text-slate-700 font-medium text-xs rounded-xl shadow-sm cursor-pointer transition flex items-center justify-center gap-2">
              <i class="fa-solid fa-camera"></i> カメラで撮影する
              <input type="file" id="input-camera" accept="image/*" capture="environment" class="hidden">
            </label>
          </div>
        </div>

        <!-- スプリット比較ビューワー -->
        <div id="split-box" class="relative hidden shadow-2xl rounded-lg overflow-hidden border border-slate-300 bg-white max-h-full max-w-full">
          <!-- 処理後画像（下層） -->
          <img id="img-processed" class="max-h-[60vh] md:max-h-[72vh] w-auto object-contain block pointer-events-none" alt="処理後">
          
          <!-- 処理前画像（上層クリップ） -->
          <div id="split-overlay" class="absolute inset-y-0 left-0 overflow-hidden pointer-events-none border-r-2 border-indigo-500 bg-white" style="width: 50%;">
            <img id="img-original" class="max-h-[60vh] md:max-h-[72vh] w-auto object-contain block pointer-events-none max-w-none" alt="処理前">
          </div>

          <!-- スライダー操作用バー（ドラッグ領域） -->
          <div id="split-bar" class="absolute inset-y-0 w-8 -ml-4 cursor-ew-resize flex items-center justify-center z-10 touch-none">
            <div class="w-7 h-7 bg-indigo-600 text-white rounded-full flex items-center justify-center shadow-lg text-[11px] border-2 border-white">
              <i class="fa-solid fa-arrows-left-right"></i>
            </div>
          </div>
        </div>

        <!-- 処理中ローディング -->
        <div id="processing-spinner" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex-col items-center justify-center text-white z-20">
          <div class="w-12 h-12 border-4 border-indigo-400 border-t-white rounded-full animate-spin mb-3"></div>
          <p id="processing-text" class="text-sm font-semibold tracking-wide">画像解析＆白紙復元中...</p>
          <p class="text-xs text-slate-300 mt-1">印刷活字・下線のみを残しています</p>
        </div>
      </div>

      <!-- 複数画像サムネイルトレイ -->
      <div id="thumbnail-tray" class="h-20 bg-white border-t border-slate-200 px-3 flex items-center gap-2 overflow-x-auto custom-scrollbar z-10 hidden flex-shrink-0">
        <label class="flex-shrink-0 w-14 h-14 border-2 border-dashed border-slate-300 rounded-lg flex flex-col items-center justify-center text-slate-400 hover:border-indigo-500 hover:text-indigo-600 cursor-pointer transition">
          <i class="fa-solid fa-plus text-xs"></i>
          <span class="text-[9px] mt-0.5">追加</span>
          <input type="file" id="input-files-tray" accept="image/*" multiple class="hidden">
        </label>
        <div id="thumbnail-list" class="flex items-center gap-2"></div>
      </div>
    </div>

    <!-- サイドコントロールパネル -->
    <aside class="w-full md:w-80 bg-white border-t md:border-t-0 md:border-l border-slate-200 p-4 flex flex-col gap-4 shadow-lg z-20 overflow-y-auto flex-shrink-0">
      
      <div>
        <h3 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">アクション</h3>
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-process-current" class="py-2.5 px-3 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-bold rounded-xl border border-indigo-200 flex items-center justify-center gap-1.5 transition disabled:opacity-40" disabled>
            <i class="fa-solid fa-wand-magic"></i> このページ消去
          </button>
          <button id="btn-process-all" class="py-2.5 px-3 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-sm flex items-center justify-center gap-1.5 transition disabled:opacity-40" disabled>
            <i class="fa-solid fa-bolt"></i> 全て一括消去
          </button>
        </div>
      </div>

      <div class="border-t border-slate-100 pt-3">
        <h3 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">消去対象の選択</h3>
        <div class="space-y-2">
          <label class="flex items-center justify-between p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
            <span class="text-xs font-semibold text-slate-700"><i class="fa-solid fa-pen text-slate-500 mr-2"></i>鉛筆の手書き文字</span>
            <input type="checkbox" id="filter-pencil" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
          </label>
          <label class="flex items-center justify-between p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
            <span class="text-xs font-semibold text-slate-700"><i class="fa-solid fa-check text-red-500 mr-2"></i>赤ペン・丸付け採点</span>
            <input type="checkbox" id="filter-red" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
          </label>
          <label class="flex items-center justify-between p-2.5 rounded-xl border border-slate-200 hover:bg-slate-50 cursor-pointer">
            <span class="text-xs font-semibold text-slate-700"><i class="fa-regular fa-sun text-amber-500 mr-2"></i>手の影・紙の黄ばみ漂白</span>
            <input type="checkbox" id="filter-shadow" checked class="rounded text-indigo-600 focus:ring-indigo-500 h-4 w-4">
          </label>
        </div>
      </div>

      <div class="border-t border-slate-100 pt-3">
        <h3 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-2">消去の強さ調整</h3>
        <div class="space-y-3">
          <div>
            <div class="flex justify-between text-[11px] text-slate-600 mb-1">
              <span>鉛筆消去の強さ</span>
              <span id="label-pencil-strength">標準 (B/2B)</span>
            </div>
            <input type="range" id="range-pencil-strength" min="1" max="3" value="2" class="w-full accent-indigo-600 h-1.5 bg-slate-200 rounded-lg cursor-pointer">
          </div>
          <div>
            <div class="flex justify-between text-[11px] text-slate-600 mb-1">
              <span>印刷文字・下線の保護</span>
              <span id="label-protect-strength">高</span>
            </div>
            <input type="range" id="range-protect" min="30" max="90" value="65" class="w-full accent-indigo-600 h-1.5 bg-slate-200 rounded-lg cursor-pointer">
          </div>
        </div>
      </div>

      <div class="mt-auto border-t border-slate-100 pt-3 flex items-center justify-between text-xs text-slate-500">
        <span id="page-indicator">プリント: 0枚</span>
        <button id="btn-delete-current" class="text-rose-500 hover:underline flex items-center gap-1 disabled:opacity-40" disabled>
          <i class="fa-regular fa-trash-can"></i> 削除
        </button>
      </div>
    </aside>
  </main>

  <script>
    const state = {
      pages: [],
      currentIndex: 0,
      splitPos: 50,
      isDraggingSplit: false
    };

    // DOM要素
    const inputFiles = document.getElementById('input-files');
    const inputCamera = document.getElementById('input-camera');
    const inputFilesTray = document.getElementById('input-files-tray');
    const emptyState = document.getElementById('empty-state');
    const splitBox = document.getElementById('split-box');
    const thumbnailTray = document.getElementById('thumbnail-tray');
    const thumbnailList = document.getElementById('thumbnail-list');
    const imgOriginal = document.getElementById('img-original');
    const imgProcessed = document.getElementById('img-processed');
    const splitOverlay = document.getElementById('split-overlay');
    const splitBar = document.getElementById('split-bar');
    const pageIndicator = document.getElementById('page-indicator');
    const btnProcessCurrent = document.getElementById('btn-process-current');
    const btnProcessAll = document.getElementById('btn-process-all');
    const btnExportPdf = document.getElementById('btn-export-pdf');
    const btnDeleteCurrent = document.getElementById('btn-delete-current');
    const spinner = document.getElementById('processing-spinner');
    const processingText = document.getElementById('processing-text');

    const filterPencil = document.getElementById('filter-pencil');
    const filterRed = document.getElementById('filter-red');
    const filterShadow = document.getElementById('filter-shadow');
    const rangePencilStrength = document.getElementById('range-pencil-strength');
    const rangeProtect = document.getElementById('range-protect');
    const labelPencilStrength = document.getElementById('label-pencil-strength');

    // 鉛筆ラベル切り替え
    rangePencilStrength.addEventListener('input', (e) => {
      const v = e.target.value;
      if (v === '1') labelPencilStrength.textContent = '弱め (HB/H)';
      else if (v === '2') labelPencilStrength.textContent = '標準 (B/2B)';
      else labelPencilStrength.textContent = '強め (3B〜/筆圧高)';
    });

    // ファイル追加処理
    function handleFiles(files) {
      if (!files || files.length === 0) return;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          state.pages.push({
            id: Date.now() + Math.random().toString(36).substring(2, 6),
            originalDataUrl: e.target.result,
            processedDataUrl: null,
            isProcessed: false
          });
          if (state.pages.length === 1) state.currentIndex = 0;
          renderUI();
        };
        reader.readAsDataURL(file);
      });
    }

    inputFiles.addEventListener('change', (e) => handleFiles(e.target.files));
    inputCamera.addEventListener('change', (e) => handleFiles(e.target.files));
    inputFilesTray.addEventListener('change', (e) => handleFiles(e.target.files));

    // UIの描画更新
    function renderUI() {
      const hasPages = state.pages.length > 0;
      emptyState.classList.toggle('hidden', hasPages);
      splitBox.classList.toggle('hidden', !hasPages);
      thumbnailTray.classList.toggle('hidden', !hasPages);

      btnProcessCurrent.disabled = !hasPages;
      btnProcessAll.disabled = !hasPages;
      btnExportPdf.disabled = !hasPages || !state.pages.some(p => p.isProcessed);
      btnDeleteCurrent.disabled = !hasPages;

      if (!hasPages) {
        pageIndicator.textContent = 'プリント: 0枚';
        return;
      }

      pageIndicator.textContent = `${state.currentIndex + 1} / ${state.pages.length} 枚`;
      const current = state.pages[state.currentIndex];

      imgOriginal.src = current.originalDataUrl;
      imgProcessed.src = current.processedDataUrl || current.originalDataUrl;

      // サムネイル更新
      thumbnailList.innerHTML = '';
      state.pages.forEach((page, idx) => {
        const thumb = document.createElement('div');
        thumb.className = `w-14 h-14 rounded-lg overflow-hidden border-2 cursor-pointer flex-shrink-0 relative ${idx === state.currentIndex ? 'border-indigo-600 ring-2 ring-indigo-300' : 'border-slate-300'}`;
        thumb.innerHTML = `
          <img src="${page.processedDataUrl || page.originalDataUrl}" class="w-full h-full object-cover">
          ${page.isProcessed ? '<span class="absolute bottom-0 right-0 bg-emerald-500 text-white text-[8px] px-1 rounded-tl font-bold">済</span>' : ''}
        `;
        thumb.onclick = () => {
          state.currentIndex = idx;
          renderUI();
        };
        thumbnailList.appendChild(thumb);
      });

      // 表示サイズ同期
      setTimeout(syncSplitSize, 50);
    }

    // スプリット画像の表示サイズを一致させる
    function syncSplitSize() {
      if (!splitBox || splitBox.classList.contains('hidden')) return;
      const rect = imgProcessed.getBoundingClientRect();
      if (rect.width > 0) {
        imgOriginal.style.width = `${rect.width}px`;
        imgOriginal.style.height = `${rect.height}px`;
        updateSplit(state.splitPos);
      }
    }

    window.addEventListener('resize', syncSplitSize);
    imgProcessed.addEventListener('load', syncSplitSize);

    // スプリットバー操作（マウス & スマホタッチ両対応）
    function updateSplit(percentage) {
      state.splitPos = Math.max(0, Math.min(100, percentage));
      splitOverlay.style.width = `${state.splitPos}%`;
      splitBar.style.left = `${state.splitPos}%`;
    }

    function onPointerMove(e) {
      if (!state.isDraggingSplit) return;
      const rect = splitBox.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const pos = ((clientX - rect.left) / rect.width) * 100;
      updateSplit(pos);
    }

    function onPointerUp() {
      state.isDraggingSplit = false;
      window.removeEventListener('mousemove', onPointerMove);
      window.removeEventListener('mouseup', onPointerUp);
      window.removeEventListener('touchmove', onPointerMove);
      window.removeEventListener('touchend', onPointerUp);
    }

    function onPointerDown(e) {
      state.isDraggingSplit = true;
      window.addEventListener('mousemove', onPointerMove);
      window.addEventListener('mouseup', onPointerUp);
      window.addEventListener('touchmove', onPointerMove);
      window.addEventListener('touchend', onPointerUp);
      e.preventDefault();
    }

    splitBar.addEventListener('mousedown', onPointerDown);
    splitBar.addEventListener('touchstart', onPointerDown, { passive: false });

    // ==========================================
    // 高精度画像処理パイプライン（ローカル解析）
    // ==========================================
    function processImageLocally(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          const cvs = document.createElement('canvas');
          const maxDim = 2048; // A4印刷に耐えうる高解像度
          let w = img.width;
          let h = img.height;

          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }

          cvs.width = w;
          cvs.height = h;
          const ctx = cvs.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          const imgData = ctx.getImageData(0, 0, w, h);
          const data = imgData.data;

          const removePencil = filterPencil.checked;
          const removeRed = filterRed.checked;
          const removeShadow = filterShadow.checked;

          const pencilLevel = parseInt(rangePencilStrength.value, 10);
          const protectThreshold = parseInt(rangeProtect.value, 10); // 印刷黒文字の保護レベル

          // 鉛筆の判定しきい値設定
          let pencilMinLum = 70;
          let pencilMaxLum = 180;
          if (pencilLevel === 1) { // 薄め
            pencilMinLum = 85; pencilMaxLum = 195;
          } else if (pencilLevel === 3) { // 濃いめ
            pencilMinLum = 50; pencilMaxLum = 175;
          }

          // ピクセルごとの局所スキャン・フィルタリング
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i+1];
            const b = data[i+2];

            // 輝度（明るさ）計算
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;

            // 1. 赤ペン・丸付け採点の消去
            if (removeRed) {
              const isRed = (r > 110) && (r > g * 1.3) && (r > b * 1.3);
              const isPinkOrStamp = (r > 130) && (g < 110) && (b < 150);
              if (isRed || isPinkOrStamp) {
                data[i] = 255; data[i+1] = 255; data[i+2] = 255;
                continue;
              }
            }

            // 2. 印刷活字・下線の保護チェック
            // 非常に濃い黒（印刷インク特有）かつRGBの偏りが少ないものは完全保護
            const isPrintedBlack = (lum < protectThreshold) && (Math.abs(r - g) < 20 && Math.abs(g - b) < 20);

            // 3. 鉛筆の手書き文字消去
            if (removePencil && !isPrintedBlack) {
              // 鉛筆の黒鉛特有の階調（中間グレーでRGBがほぼ等しい）
              const isGray = (Math.abs(r - g) < 18) && (Math.abs(g - b) < 18);
              if (isGray && lum >= pencilMinLum && lum <= pencilMaxLum) {
                data[i] = 255; data[i+1] = 255; data[i+2] = 255;
                continue;
              }
            }

            // 4. 手の影・紙の黄ばみのブリーチ（真っ白化）
            if (removeShadow) {
              if (lum > 140) {
                // 明るい部分は紙面とみなして純白に漂白
                data[i] = 255; data[i+1] = 255; data[i+2] = 255;
              } else if (isPrintedBlack) {
                // 印刷文字はくっきりと黒を引き締める
                data[i] = Math.max(0, r - 30);
                data[i+1] = Math.max(0, g - 30);
                data[i+2] = Math.max(0, b - 30);
              }
            }
          }

          ctx.putImageData(imgData, 0, 0);
          resolve(cvs.toDataURL('image/jpeg', 0.92));
        };
        img.src = dataUrl;
      });
    }

    // 1枚消去の実行
    btnProcessCurrent.addEventListener('click', async () => {
      const page = state.pages[state.currentIndex];
      spinner.classList.remove('hidden');
      spinner.classList.add('flex');
      processingText.textContent = `${state.currentIndex + 1}枚目を白紙化中...`;

      try {
        page.processedDataUrl = await processImageLocally(page.originalDataUrl);
        page.isProcessed = true;
        renderUI();
      } catch (err) {
        alert('処理中にエラーが発生しました: ' + err.message);
      } finally {
        spinner.classList.add('hidden');
        spinner.classList.remove('flex');
      }
    });

    // 全プリント一括消去
    btnProcessAll.addEventListener('click', async () => {
      spinner.classList.remove('hidden');
      spinner.classList.add('flex');

      try {
        for (let i = 0; i < state.pages.length; i++) {
          processingText.textContent = `一括消去中: ${i + 1} / ${state.pages.length} 枚目...`;
          state.pages[i].processedDataUrl = await processImageLocally(state.pages[i].originalDataUrl);
          state.pages[i].isProcessed = true;
        }
        renderUI();
      } catch (err) {
        alert('一括処理中にエラーが発生しました: ' + err.message);
      } finally {
        spinner.classList.add('hidden');
        spinner.classList.remove('flex');
      }
    });

    // まとめてPDF書き出し
    btnExportPdf.addEventListener('click', () => {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF('p', 'mm', 'a4');
      const processedPages = state.pages.filter(p => p.isProcessed);

      if (processedPages.length === 0) {
        alert('消去処理済みのプリントがありません。先に消去を実行してください。');
        return;
      }

      processedPages.forEach((page, index) => {
        if (index > 0) pdf.addPage();
        const img = new Image();
        img.src = page.processedDataUrl;
        
        // A4用紙（210 x 297 mm）に余白10mmで均等配置
        const pageWidth = 210;
        const pageHeight = 297;
        const margin = 10;
        const targetW = pageWidth - margin * 2;
        const targetH = pageHeight - margin * 2;
        
        pdf.addImage(img, 'JPEG', margin, margin, targetW, targetH, undefined, 'FAST');
      });

      pdf.save(`宿題プリント_解き直し_${Date.now()}.pdf`);
    });

    // 削除ボタン
    btnDeleteCurrent.addEventListener('click', () => {
      if (!confirm('このプリントを削除しますか？')) return;
      state.pages.splice(state.currentIndex, 1);
      if (state.currentIndex >= state.pages.length) {
        state.currentIndex = Math.max(0, state.pages.length - 1);
      }
      renderUI();
    });
  </script>
</body>
</html>
